<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NT Rhythm Grid - MultiSound</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #fff; border: 2px solid #555; }
    </style>
</head>
<body>
    <canvas id="g"></canvas>
    <script>
        const canvas = document.getElementById('g');
        const ctx = canvas.getContext('2d');
        const W = 360, H = 675;
        const COLS = 4, SIZE = W / COLS;
        canvas.width = W; canvas.height = H;

        let nt = new Image(); nt.src = 'NT.png';
        let tiles = [], score = 0, over = false;

        function addTile(y) {
            tiles.push({ x: Math.floor(Math.random() * COLS), y: y });
        }

        for (let i = 0; i < 8; i++) addTile(i);

        function playSound() {
            let s = new Audio('SanSanVoice.mp3');
            s.play();
            
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = '#ccc';
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, H); ctx.stroke();
            }
            for (let i = 0; i <= 8; i++) {
                let yL = H - i * SIZE;
                ctx.beginPath(); ctx.moveTo(0, yL); ctx.lineTo(W, yL); ctx.stroke();
            }

            tiles.forEach(t => {
                let yPos = H - (t.y + 1) * SIZE;
                if (yPos < H) ctx.drawImage(nt, t.x * SIZE + 2, yPos + 2, SIZE - 4, SIZE - 4);
            });

            ctx.fillStyle = 'red'; ctx.font = 'bold 24px sans-serif';
            ctx.fillText(`Score: ${score}`, 10, 35);

            if (over) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', W/2, H/2);
                ctx.textAlign = 'left';
            }
            requestAnimationFrame(draw);
        }

        canvas.onclick = (e) => {
            if (over) return location.reload();
            const rect = canvas.getBoundingClientRect();
            const px = Math.floor((e.clientX - rect.left) / SIZE);
            const py = Math.floor((H - (e.clientY - rect.top)) / SIZE);

            if (tiles.length > 0 && tiles[0].x === px && py === 0) {
                tiles.shift();
                tiles.forEach(t => t.y--);
                addTile(tiles[tiles.length - 1].y + 1);
                score++;
                playSound();
            } else {
                over = true;
            }
        };
        nt.onload = draw;
    </script>
</body>
</html>
